# Keyless real-Loader composition for the parent-only override inheritance
# snapshot. The deployment default is workspace-write (Mode A); the seeded
# parent session carries a matching session-scoped override, the resumed
# parent delegates, and the inherited capture is what confines the child's
# outside-workspace write, so this scenario is the assembled-app red/green
# anchor for the delegation path.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

# file/override/childFiles all default to their DSH_SNAPSHOT_* env vars.
- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

# The confining filesystem stack: the deployment mode lives on the shared
# policy home; the seeded parent's override must reach INSIDE the child for
# the scenario to deny.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# The approval seam with no answerer attached (one-shot, no GUI): the child's
# outside-workspace write prompts, nobody listens, and the ask fails closed as
# `unavailable` with its asked/decided audit pair — the honest headless shape
# of the Mode A prompt.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# This scenario probes filesystem confinement only, so the bash stack is absent:
# without it the bundle's `toolBash: false` is required, because `tool-bash` would
# otherwise wait forever for a `bash` executor this tree never mounts.
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/subagent-inheritance-agent.ts'
